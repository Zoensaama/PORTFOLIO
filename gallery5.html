<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <div class="gallery-container">
        <button class="nav-arrow left-arrow">
            <img src="IMG/gif/arrow_left.gif" alt="Previous">
        </button> 

        <div class="image-display">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&h=800&fit=crop" alt="Gallery Image 1" class="gallery-image active">
            <img src="https://images.unsplash.com/photo-1618556450994-a6a128ef0d9d?w=1200&h=800&fit=crop" alt="Gallery Image 2" class="gallery-image">
            <img src="https://images.unsplash.com/photo-1618556450991-2f1af64e8191?w=1200&h=800&fit=crop" alt="Gallery Image 3" class="gallery-image">
            <img src="https://images.unsplash.com/photo-1618556450962-96534584abf4?w=1200&h=800&fit=crop" alt="Gallery Image 4" class="gallery-image">
        </div>
        
        <button class="nav-arrow right-arrow">
            <img src="IMG/gif/arrow_right.gif" alt="Next">
        </button>
                
        <a href="index.html" class="back-button">
            <img src="IMG/gif/arrow1.gif" alt="Back">
        </a>    
    </div>

    <script src="gallery.js"></script>
</body>
</html>
